# Minimal TDengine 2.4 server configuration for the single-node test
# container.
#
# fqdn must be an IP literal (not the container hostname): taosd uses it
# as its local endpoint and redirects clients to it, so a hostname that is
# not resolvable inside the container (or that resolves to a container IP
# the client cannot reach via loopback) breaks the mnode handshake.

firstEp               127.0.0.1:6030
secondEp              127.0.0.1:6030
fqdn                  127.0.0.1
dataDir               /var/lib/taos
logDir                /var/log/taos
