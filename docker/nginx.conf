# nginx configuration for the lua-resty-taos test container.
#
# Exposes two endpoints that exercise the driver against the real TDengine
# server running in the same container:
#   GET /version  -> client + server versions
#   GET /test     -> full CRUD smoke test (create db/table, insert, select)

worker_processes  1;
error_log  /usr/local/openresty/nginx/logs/error.log debug;
pid        /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    lua_package_path '/usr/local/lvhuan/lua-resty-taos/lib/?.lua;;';

    server {
        listen 8080;

        location /version {
            content_by_lua_block {
                local taos = require "resty.taos"

                local d = taos:new()
                d:init()
                ngx.say("client: " .. d:get_client_info())

                local conf = {
                    host = "127.0.0.1", port = 6030,
                    user = "root", password = "taosdata",
                }
                local c = d:connect(conf)
                if c.code ~= 0 then
                    ngx.say("connect failed: " .. tostring(c.error))
                    return
                end
                ngx.say("server: " .. d:get_server_info())
                d:close()
            }
        }

        location /test {
            content_by_lua_block {
                local cjson = require "cjson"
                local taos = require "resty.taos"

                local result = { ok = false, fail = nil, steps = {} }

                local function step(name, ok, detail)
                    result.steps[#result.steps + 1] = {
                        name = name, ok = ok, detail = detail
                    }
                    if not ok then
                        result.fail = result.fail or name
                    end
                end

                local conf = {
                    host = "127.0.0.1", port = 6030,
                    user = "root", password = "taosdata",
                }
                local d = taos:new()
                local c = d:connect(conf)
                step("connect", c.code == 0, c.error or "ok")

                if c.code == 0 then
                    local r

                    r = d:query("drop database if exists demo")
                    step("drop database", r and r.code == 0, r and r.error)

                    r = d:query("create database demo")
                    step("create database", r and r.code == 0, r and r.error)

                    r = d:query("use demo")
                    step("use database", r and r.code == 0, r and r.error)

                    r = d:query("create table m1 (ts timestamp, speed int, owner binary(20))")
                    step("create table", r and r.code == 0, r and r.error)

                    r = d:query("insert into m1 values ('2019-09-01 00:00:00.001',0,'robotspace'), ('2019-09-01 00:00:00.002',1,'Hilink')")
                    step("insert 2 rows", r and r.code == 0 and r.affected == 2,
                         r and ("affected=" .. tostring(r.affected)) or tostring(r.error))

                    r = d:query("select * from m1")
                    step("select 2 rows", r and r.code == 0 and r.item and #r.item == 2,
                         r and ("rows=" .. tostring(r.item and #r.item)) or tostring(r.error))
                    if r and r.item and r.item[1] then
                        result.first_row = r.item[1]
                    end

                    d:close()
                end

                result.ok = not result.fail
                ngx.say(cjson.encode(result))
            }
        }
    }
}
