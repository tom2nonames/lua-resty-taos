# lua-resty-taos real-environment test stack.
#
# One container runs both the TDengine 2.4 server (taosd) and an OpenResty
# with this driver loaded, exposing:
#   :6030  - TDengine native port (taosd)
#   :6041  - TDengine REST port
#   :8080  - nginx test endpoints (/version, /test)
#
# The image must run as linux/amd64 (TDengine 2.4 only ships x86_64;
# Docker auto-emulates on arm64 hosts).
#
# Quick start:
#   docker compose up --build -d
#   curl http://127.0.0.1:8080/test
#   docker compose exec taos resty --errlog-level debug /usr/local/lvhuan/lua-resty-taos/test.lua
services:
  taos:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: lvhuan/lua-resty-taos:test
    platform: linux/amd64
    container_name: lh-taos-test
    ports:
      - "6030:6030"
      - "6041:6041"
      - "8080:8080"
    volumes:
      # Live-mount the library and test scripts for fast iteration.
      - ./lib:/usr/local/lvhuan/lua-resty-taos/lib:rw
      - ./test.lua:/usr/local/lvhuan/lua-resty-taos/test.lua:rw
      - ./test1.lua:/usr/local/lvhuan/lua-resty-taos/test1.lua:rw
